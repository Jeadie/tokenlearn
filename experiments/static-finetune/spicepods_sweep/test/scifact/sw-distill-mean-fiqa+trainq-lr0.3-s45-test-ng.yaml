version: v1
kind: Spicepod
name: sw-distill-mean-fiqa+trainq-lr0.3-s45-test-ng

metadata:
  benchmark_dataset: scifact_retrieval

datasets:

  # MTEB scifact retrieval (https://huggingface.co/datasets/mteb/scifact), pinned local copy.

  - from: file:/Users/jeadie_compute/Github/tokenlearn/data/static-finetune/mteb/scifact/corpus.parquet
    name: corpus
    acceleration:
      enabled: true
      engine: arrow
    columns:
      - name: text
        embeddings:
          - from: embed
            row_id:
              - _id

  - from: file:/Users/jeadie_compute/Github/tokenlearn/data/static-finetune/mteb/scifact/queries.parquet
    name: queries
    acceleration:
      enabled: true
      engine: arrow

  - from: file:/Users/jeadie_compute/Github/tokenlearn/data/static-finetune/mteb/scifact/qrels_test.parquet
    name: relevance_data
    acceleration:
      enabled: true
      engine: arrow

views:
  # Only judged queries: scoring ignores the rest, so sending them only costs time.
  - name: test_queries
    sql: SELECT _id, text FROM queries WHERE _id IN (SELECT DISTINCT "query-id" FROM relevance_data)

embeddings:
  - from: model2vec:/Users/jeadie_compute/Github/tokenlearn/models/static-finetune/sweep/sw-distill-mean-fiqa+trainq-lr0.3-s45
    name: embed
    params:
      embed_max_token_length: 512
